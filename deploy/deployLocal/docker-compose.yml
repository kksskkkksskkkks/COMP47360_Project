services:
  db:
    image: mysql:8.0
    container_name: gem-mysql-local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gem_finder

    networks:
      - gem-net

    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: gem-ollama-local
    restart: always
    networks:
      - gem-net

    volumes:
      - ./ollama_data:/root/.ollama

  backend:
    build: ./backend
    container_name: gem-backend-local
    restart: always
    networks:
      - gem-net

    environment:
      - SERVER_ADDRESS=0.0.0.0
      - DB_HOST=db
      - DB_PORT=3306
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - CORS_ALLOWED_ORIGINS=http://localhost
      - INTERNAL_SECRET=dev-secret-change-in-prod-hihfibwigjbwalegibralgjbpiu3vtpiuy289g3t92btu$%@^!^&#@&#!@(*#PY(VYG&*!G*YV#!)&VC#TV!C#
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  nginx:
    image: nginx:latest
    container_name: gem-nginx-local
    restart: always
    networks:
      - gem-net
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

networks:
  gem-net:
    driver: bridge