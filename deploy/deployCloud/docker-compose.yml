services:
  db:
    image: mysql:8.0
    container_name: gem-mysql-prod
    restart: always
    mem_limit: 2g
    mem_reservation: 1.5g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gem_finder

    networks:
      - gem-net

    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: gem-ollama-prod
    restart: always
    mem_limit: 4g
    mem_reservation: 3g
    networks:
      - gem-net

    volumes:
      - ./ollama_data:/root/.ollama

  backend:
    build: ./backend
    container_name: gem-backend-prod
    restart: always
    mem_limit: 2.5g
    mem_reservation: 1.5g
    networks:
      - gem-net

    environment:
      - SERVER_ADDRESS=0.0.0.0
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - CORS_ALLOWED_ORIGINS=https://gemfinder.bikeproject.work,https://www.gemfinder.bikeproject.work
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  nginx:
    image: nginx:latest
    container_name: gem-nginx-prod
    restart: always
    networks:
      - gem-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl/origin.crt:/etc/nginx/ssl/cert.pem:ro
      - ./nginx/ssl/origin.key:/etc/nginx/ssl/cert.key:ro
    depends_on:
      - backend

  prediction:
    build: ./prediction
    container_name: gem-prediction-prod
    restart: always
    networks:
      - gem-net
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}

    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    mem_limit: 6g
    mem_reservation: 3g

networks:
  gem-net:
    driver: bridge


